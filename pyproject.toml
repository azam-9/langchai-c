[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sohail Azam", email = "sohailazam60@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "black>=25.11.0",
    "isort>=6.1.0",
    "langchain>=0.3.30",
    "langchain-anthropic>=0.3.22",
    "langchain-ollama>=0.3.10",
    "langchain-openai>=0.3.35",
    "python-dotenv>=1.2.1",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
